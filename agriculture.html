<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPulse | Live Online Pro</title>
    
    <style>
        :root { --main: #1b4332; --light: #f4fcf9; --up: #2ebd59; --down: #e74c3c; --accent: #ffa502; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: var(--light); color: #333; padding-bottom: 50px; }

        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--main); }
        .lang-nav button { border: 1px solid #ddd; background: #fff; padding: 6px 14px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-left: 5px; }
        .lang-nav button.active { background: var(--main); color: #fff; }

        .hero { background: var(--main); padding: 50px 5%; text-align: center; color: white; }
        .box { max-width: 650px; margin: 0 auto; display: flex; background: #fff; border-radius: 50px; padding: 6px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .box input { flex: 1; border: none; outline: none; padding: 12px 25px; border-radius: 50px; font-size: 1.1rem; color: #333;}
        .box button { background: var(--accent); border: none; padding: 0 30px; border-radius: 50px; color: white; cursor: pointer; font-weight: bold; }
        
        #yard-tags { margin-top: 25px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .y-btn { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: 600; }

        #dash { display: none; padding: 30px 5%; max-width: 1200px; margin: -40px auto 40px; }
        .dash-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .white-panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .price-tbl { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .price-tbl td { padding: 12px 0; border-bottom: 1px solid #f8f8f8; font-weight: bold; }
        .up { color: var(--up); } .down { color: var(--down); }

        .sec-h { display: flex; justify-content: space-between; align-items: center; padding: 40px 5% 20px; flex-wrap: wrap; }
        .city-box { display: flex; background: white; border-radius: 5px; overflow: hidden; border: 1px solid #ddd; }
        .city-box input { border: none; padding: 10px; outline: none; }
        .city-box button { background: var(--main); color: white; border: none; padding: 10px 15px; cursor: pointer; }

        main { padding: 0 5%; max-width: 1300px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 20px; flex-grow: 1; }
        .info h3 { font-size: 1rem; line-height: 1.4; color: #111; }
        .foot { padding: 15px 20px; border-top: 1px solid #f9f9f9; display: flex; justify-content: space-between; }
        .btn-wa { background: #25d366; color: white; padding: 7px 15px; border-radius: 5px; text-decoration: none; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AGRIPULSE <span>LIVE</span></div>
        <div class="lang-nav">
            <button id="l-en" class="active" onclick="init('en')">English</button>
            <button id="l-hi" onclick="init('hi')">हिन्दी</button>
            <button id="l-gu" onclick="init('gu')">ગુજરાતી</button>
        </div>
    </header>

    <div class="hero">
        <h2 id="hero-txt">Trace Live Mandi & GPS</h2>
        <div class="box">
            <input type="text" id="mSearch" placeholder="Search Mandi location...">
            <button onclick="findYards()">TRACE</button>
        </div>
        <div id="yard-tags"></div>
    </div>

    <section id="dash">
        <div class="dash-container">
            <div class="white-panel">
                <iframe id="mapBox" width="100%" height="280" frameborder="0"></iframe>
                <a href="#" id="gpsLink" target="_blank" style="display:block; text-align:center; background:#4285F4; color:white; padding:12px; border-radius:8px; text-decoration:none; margin-top:15px; font-weight:bold;">GPS DIRECTIONS</a>
            </div>
            <div class="white-panel">
                <h3 id="yardTitle" style="color:var(--main);">Select a Yard</h3>
                <table class="price-tbl"><tbody id="priceBody"></tbody></table>
            </div>
        </div>
    </section>

    <div class="sec-h">
        <h2 id="n-label">Agriculture News</h2>
        <div class="city-box">
            <input type="text" id="citySearch" placeholder="Enter City for news...">
            <button onclick="fetchLocalNews()">FIND</button>
        </div>
    </div>

    <main>
        <div id="n-grid" class="grid"></div>
        <h2 id="v-label" style="padding:40px 0 20px;">Trending Videos</h2>
        <div id="v-grid" class="grid"></div>
    </main>

    <script>
        const NEWS_API = 'ccee108184e74d4aa2e9ab8f333fe0b7';
        const YT_API = 'AIzaSyDfk0dvNS0177fs6_AftWqiSYa-pVLMqRE';

        // THE FIX: We use a CORS Proxy for NewsAPI
        const PROXY = "https://api.allorigins.win/raw?url=";

        let lang = 'en';

        async function init(l) {
            lang = l;
            document.querySelectorAll('.lang-nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('l-'+l).classList.add('active');
            
            // Initial Content
            const query = (lang === 'hi') ? 'खेती' : (lang === 'gu' ? 'ખેતીવાડી' : 'agriculture');
            loadNews(query);
            loadVideos(query);
        }

        async function loadNews(q) {
            const grid = document.getElementById('n-grid');
            grid.innerHTML = 'Loading News...';
            
            // Build the URL through the PROXY to bypass NewsAPI restriction
            const targetUrl = `https://newsapi.org/v2/everything?q=${encodeURIComponent(q)}&language=${lang === 'en' ? 'en' : ''}&sortBy=publishedAt&apiKey=${NEWS_API}`;
            
            try {
                const response = await fetch(PROXY + encodeURIComponent(targetUrl));
                const data = await response.json();
                
                grid.innerHTML = '';
                data.articles.slice(0, 6).forEach(a => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${a.urlToImage || 'https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?w=500'}">
                            <div class="info"><h3>${a.title}</h3></div>
                            <div class="foot">
                                <a href="${a.url}" target="_blank" style="color:var(--main); font-weight:bold;">DETAILS</a>
                                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(a.title + ' ' + a.url)}" class="btn-wa">WhatsApp</a>
                            </div>
                        </div>`;
                });
            } catch(e) { grid.innerHTML = "Offline - Check NewsAPI Daily Limit."; }
        }

        async function loadVideos(q) {
            const vGrid = document.getElementById('v-grid');
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=2&q=${encodeURIComponent(q + ' farming')}&key=${YT_API}`);
                const data = await res.json();
                vGrid.innerHTML = '';
                data.items.forEach(v => {
                    vGrid.innerHTML += `
                        <div class="card">
                            <iframe src="https://www.youtube.com/embed/${v.id.videoId}" allowfullscreen></iframe>
                            <div class="foot" style="justify-content:center;">
                                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent('Farming Video: ' + v.snippet.title + ' https://youtu.be/' + v.id.videoId)}" class="btn-wa">SHARE VIDEO</a>
                            </div>
                        </div>`;
                });
            } catch(e) {}
        }

        function findYards() {
            const city = document.getElementById('mSearch').value;
            const tags = document.getElementById('yard-tags');
            const res = [city + " Main Yard", city + " Sub Yard"];
            tags.innerHTML = '';
            res.forEach(r => {
                tags.innerHTML += `<button class="y-btn" onclick="openDash('${r}')">📍 ${r}</button>`;
            });
        }

        function openDash(name) {
            document.getElementById('dash').style.display = 'block';
            document.getElementById('yardTitle').innerText = name;
            document.getElementById('mapBox').src = `https://maps.google.com/maps?q=${encodeURIComponent(name)}&output=embed`;
            document.getElementById('gpsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(name)}`;
            
            const tbody = document.getElementById('priceBody');
            tbody.innerHTML = '<tr><td>Wheat</td><td>₹2500</td><td style="color:green;">▲ +15</td></tr><tr><td>Cotton</td><td>₹7200</td><td style="color:red;">▼ -20</td></tr>';
        }

        function fetchLocalNews() {
            const city = document.getElementById('citySearch').value;
            loadNews(city);
        }

        window.onload = () => init('en');
    </script>
</body>
</html>
